# Security headers for the Sentinel frontend (replaces the first headers block of vercel.json, finding SEC-09).
# Kept in a file of its own because nginx drops the headers of the server block in any location that has an add_header of its own.
# Include this file in every location that sets its own add_header.
# The frontend is built with VITE_API_BASE_URL set to the site's own address, so connect-src needs no onrender.com wildcard.
# Replace YOURPROJECT with the Supabase project address (https://YOURPROJECT.supabase.co). The exact address is narrower than the old
# https://*.supabase.co wildcard (see Section 11.15 of the documentation). Keep the Cloudflare entries only while Turnstile is switched on.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://YOURPROJECT.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
