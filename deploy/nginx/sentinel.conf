# Sentinel on one server: nginx serves the built frontend and forwards /api to the backend.
# Put this file in /etc/nginx/conf.d/ (it is read inside the http block) and the headers file next to it.
# Replace sentinel.example.org, the certificate paths and the folder of the built frontend.
#
# Frontend build (VITE_API_BASE_URL is the site's own address, so the browser calls /api on the same address):
#   VITE_API_BASE_URL=https://sentinel.example.org VITE_API_KEY=... VITE_SUPABASE_URL=... VITE_SUPABASE_PUBLISHABLE_KEY=... npm run build
#
# Backend start (systemd), listening only on the local machine, nginx on the same machine:
#   uvicorn app.main:app --host 127.0.0.1 --port 8000 --no-server-header --proxy-headers --forwarded-allow-ips=127.0.0.1
# render.yaml has --forwarded-allow-ips='*' (trust a forwarded address from anyone). That is fine behind Render's own load balancer
# and wrong anywhere else: a caller who can reach the backend directly could then fake its address and get around the rate limits.
# With nginx in another container or machine, put that machine's address in --forwarded-allow-ips instead of 127.0.0.1. The Dockerfile has
# --proxy-headers but no --forwarded-allow-ips, so it trusts only 127.0.0.1: behind a proxy in another container every caller would look
# like the proxy and share one rate limit. Add --forwarded-allow-ips with the proxy's address.
# Backend settings: ALLOWED_ORIGINS=https://sentinel.example.org, ENABLE_DOCS unset (off), and the secrets of Section 6.4.

server_tokens off;                      # no nginx version in the Server header

upstream sentinel_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name sentinel.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sentinel.example.org;

    ssl_certificate     /etc/ssl/sentinel/fullchain.pem;
    ssl_certificate_key /etc/ssl/sentinel/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    root /var/www/sentinel;             # the dist folder of the build
    index index.html;

    # Batch files are limited to 10 MB by the backend (BATCH_MAX_FILE_MB). 25 MB leaves room for the list files an administrator uploads;
    # raise it if those are larger.
    client_max_body_size 25m;

    # Headers are included in each location below that sets its own add_header (see the note in the headers file).
    # The /api location has none: the backend sets its own security headers on its answers, and adding these too would repeat them.

    # The API. Only /api is forwarded, so /docs, /redoc and /openapi.json are never reachable from outside.
    location /api/ {
        proxy_pass http://sentinel_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # $proxy_add_x_forwarded_for ADDS the address nginx saw to the end of the header. Never replace it with $http_x_forwarded_for.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A screening downloads the lists and may call the AI service, and a batch can run long. The backend gives up on its own first.
        proxy_read_timeout 180s;
    }

    # Built files with a hash in the name can be kept for a year (the same rule as vercel.json).
    location /assets/ {
        try_files $uri =404;
        include /etc/nginx/conf.d/sentinel-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location ~* \.(jpg|jpeg|png|webp|svg)$ {
        try_files $uri =404;
        include /etc/nginx/conf.d/sentinel-security-headers.conf;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # Single page app: every other path gets index.html, so a reload or a bookmark of /sign-in works.
    location / {
        try_files $uri /index.html;
        include /etc/nginx/conf.d/sentinel-security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
